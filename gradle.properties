# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Nov 19 15:59:34 CST 2022

org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096M
android.useAndroidX=true
android.enableJetifier=true
org.gradle.workers.max=1
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# Fix for Hilt + KSP duplicate class errors
ksp.incremental=false
kotlin.incremental=false
# Ensure Hilt uses KSP correctly
hilt.enableKsp=true
# Disable configuration cache temporarily to ensure dependencies are re-evaluated
org.gradle.configuration-cache=false
# Avoid parallel execution if file locking is an issue on Windows
org.gradle.parallel=false
