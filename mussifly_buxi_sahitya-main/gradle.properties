## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Nov 19 15:59:34 CST 2022

org.gradle.jvmargs=-Xmx4096M -Dkotlin.daemon.jvm.options\="-Xmx4096M"
android.useAndroidX=true
android.enableJetifier=true
org.gradle.unsafe.configuration-cache=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# Enable R8 full mode for better code shrinking
android.enableR8.fullMode=true

# Enable parallel builds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Prevent Gradle from reusing old protobuf versions that caused conflicts
android.enableDexingArtifactTransform.cache=true

# Optimize build performance
org.gradle.daemon=true
org.gradle.workers.max=4
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Note: Duplicate class warnings for protobuf classes are expected and harmless.
# They occur because both protobuf-javalite and protolite-well-known-types contain
# the same protobuf classes. The pickFirsts configuration in build.gradle.kts
# handles these duplicates at packaging time, preferring protobuf-javalite classes.
# The build will succeed despite these warnings.

kapt.incremental.apt=false
kapt.use.worker.api=true
kapt.correctErrorTypes=true
